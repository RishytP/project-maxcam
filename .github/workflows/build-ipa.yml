name: "Build MaxCam"

# The app targets iOS 26 APIs (AVCaptureColorSpace.appleLog2, dynamic aspect
# ratio). Those symbols only exist in the iOS 26+ SDK, which ships with Xcode 26
# and later, so the build runs on a macOS 26 runner. The deployment target stays
# at iOS 17.0 because every iOS 26 symbol is reached behind an `#available`
# guard, so the product still installs on older iPhones.

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build, test, package
    runs-on: macos-26

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 'latest-stable'

      - name: Report toolchain
        run: |
          xcodebuild -version
          echo "--- installed SDKs ---"
          xcodebuild -showsdks || true
          echo "--- available simulators ---"
          xcrun simctl list devices available || true

      - name: Validate project graph
        run: python3 scripts/validate_pbxproj.py

      - name: Ensure app icon exists
        run: python3 scripts/generate_app_icon.py

      - name: Resolve test destination
        id: destination
        run: |
          set -euo pipefail
          # Prefer an installed iPhone 17 simulator, then any iPhone, then any
          # iOS simulator. The runner image decides what is actually present, so
          # the destination is discovered instead of hard-coded.
          for name in "iPhone 17" "iPhone 16" "iPhone 15" "iPhone Air"; do
            if xcrun simctl list devices available | grep -q "$name"; then
              echo "destination=platform=iOS Simulator,name=$name" >> "$GITHUB_OUTPUT"
              echo "Using simulator: $name"
              exit 0
            fi
          done
          udid=$(xcrun simctl list devices available --json \
            | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; print(next((x["udid"] for k,v in d.items() if "iOS" in k for x in v if x["isAvailable"]), ""))')
          if [ -z "$udid" ]; then
            echo "::error::No available iOS simulator found"
            exit 1
          fi
          echo "destination=platform=iOS Simulator,id=$udid" >> "$GITHUB_OUTPUT"
          echo "Using simulator UDID: $udid"

      - name: Run unit tests
        run: |
          xcodebuild test \
            -project MaxCam.xcodeproj \
            -scheme MaxCam \
            -configuration Debug \
            -destination '${{ steps.destination.outputs.destination }}' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO

      - name: Build unsigned device app
        run: |
          xcodebuild build \
            -workspace MaxCam.xcworkspace \
            -scheme MaxCam \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER=""

      - name: Package IPA
        run: |
          set -euo pipefail
          APP="build/Build/Products/Release-iphoneos/MaxCam.app"
          if [ ! -d "$APP" ]; then
            echo "::error::Expected app bundle not found at $APP"
            find build/Build/Products -maxdepth 3 -name '*.app' -print
            exit 1
          fi
          rm -rf Payload MaxCam.ipa
          mkdir -p Payload
          cp -R "$APP" Payload/
          /usr/bin/zip -qry MaxCam.ipa Payload
          echo "IPA contents:"
          /usr/bin/unzip -l MaxCam.ipa | sed -n '1,20p'

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: MaxCam-unsigned-ipa
          path: MaxCam.ipa
          if-no-files-found: error
